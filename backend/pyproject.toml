[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bugsy-backend"
version = "0.1.0"
description = "Bugsy API scaffold"
requires-python = ">=3.12"
dependencies = [
    "contree-client[httpx]==0.4.1",
    "contree-sdk==0.3.6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.60,<2",
    "packaging>=24,<27",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
